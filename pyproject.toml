[project]
name = "codingame-mcp"
version = "0.1.0"
description = "Read-only MCP server for the undocumented CodinGame API (cookie auth)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.2",
    "httpx>=0.28",
    "pydantic>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[project.scripts]
codingame-mcp = "codingame_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codingame_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
